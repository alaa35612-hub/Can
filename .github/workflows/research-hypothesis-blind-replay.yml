name: Research Hypothesis Blind Replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/tools/blind_replay_symbol_hypotheses.py'
      - 'research/tools/tests/test_blind_replay_symbol_hypotheses.py'
      - '.github/workflows/research-hypothesis-blind-replay.yml'
      - 'research/mechanism_validation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run hypothesis blind-replay tests
        run: python -m unittest research/tools/tests/test_blind_replay_symbol_hypotheses.py -v

      - name: Replay frozen symbol hypotheses
        run: >-
          python research/tools/blind_replay_symbol_hypotheses.py
          --mechanism-root research/mechanism_validation
          --output-root research/hypothesis_blind_replay
          --symbols BANKUSDT ESPORTSUSDT

      - name: Commit generated blind-replay outputs
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- research/hypothesis_blind_replay)" ]; then
            echo 'Hypothesis blind-replay outputs are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/hypothesis_blind_replay
          git commit -m 'research: generate hypothesis blind replay [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

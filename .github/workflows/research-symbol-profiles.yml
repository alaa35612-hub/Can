name: Research Symbol Profiles

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/tools/build_symbol_profiles.py'
      - 'research/tools/tests/test_build_symbol_profiles.py'
      - '.github/workflows/research-symbol-profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest research/tools/tests/test_build_symbol_profiles.py -v

      - name: Build symbol-specific profiles
        run: >-
          python research/tools/build_symbol_profiles.py
          --case-root research/case_studies
          --output-root research/symbol_profiles
          --symbols AKEUSDT BANKUSDT ESPORTSUSDT LYNUSDT

      - name: Commit generated profiles
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- research/symbol_profiles)" ]; then
            echo 'Profiles unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/symbol_profiles
          git commit -m 'research: generate symbol-specific structural profiles [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

name: causal-upside-detector

on:
  push:
    branches:
      - "feature/causal-upside-precursor-detector"
  pull_request:
    paths:
      - "causal_upside/**"
      - "causal_upside_scanner.py"
      - "tests/**"
      - "PRODUCTION.md"
      - ".github/workflows/causal-upside-detector.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q causal_upside causal_upside_scanner.py tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python causal_upside_scanner.py --help

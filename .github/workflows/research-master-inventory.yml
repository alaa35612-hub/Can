name: Research Master Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/tools/build_master_inventory.py'
      - 'research/tools/tests/**'
      - '.github/workflows/research-master-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run inventory tests
        run: python -m unittest discover -s research/tools/tests -v

      - name: Build complete repository inventory
        run: >-
          python research/tools/build_master_inventory.py
          --root .
          --output-dir research/inventory/generated

      - name: Commit generated inventory reports
        shell: bash
        run: |
          if git diff --quiet -- research/inventory/generated; then
            echo 'Inventory outputs are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/inventory/generated
          git commit -m 'research: generate master inventory pass 2 [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

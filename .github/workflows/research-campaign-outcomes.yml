name: Research Campaign Outcome Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/tools/audit_campaign_outcomes.py'
      - 'research/tools/audit_campaign_outcomes_v2.py'
      - 'research/tools/tests/test_audit_campaign_outcomes.py'
      - 'research/tools/tests/test_audit_campaign_outcomes_v2.py'
      - '.github/workflows/research-campaign-outcomes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run outcome-audit tests
        run: >-
          python -m unittest
          research/tools/tests/test_audit_campaign_outcomes.py
          research/tools/tests/test_audit_campaign_outcomes_v2.py
          -v

      - name: Audit campaign outcomes after frozen cutoffs
        run: >-
          python research/tools/audit_campaign_outcomes_v2.py
          --case-root research/case_studies
          --profile-root research/symbol_profiles
          --output-root research/outcome_audits
          --symbols AKEUSDT BANKUSDT ESPORTSUSDT LYNUSDT

      - name: Commit generated outcome audits
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- research/outcome_audits)" ]; then
            echo 'Outcome audits are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/outcome_audits
          git commit -m 'research: generate campaign outcome audits [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

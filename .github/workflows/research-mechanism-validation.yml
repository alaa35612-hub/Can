name: Research Mechanism Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/tools/validate_symbol_mechanisms.py'
      - 'research/tools/tests/test_validate_symbol_mechanisms.py'
      - '.github/workflows/research-mechanism-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run mechanism-validation tests
        run: python -m unittest research/tools/tests/test_validate_symbol_mechanisms.py -v

      - name: Validate symbol-specific mechanisms
        run: >-
          python research/tools/validate_symbol_mechanisms.py
          --root .
          --case-root research/case_studies
          --profile-root research/symbol_profiles
          --outcome-root research/outcome_audits
          --output-root research/mechanism_validation
          --symbols AKEUSDT BANKUSDT ESPORTSUSDT LYNUSDT
          --source-sensitivity-symbols BANKUSDT LYNUSDT

      - name: Commit generated validation outputs
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- research/mechanism_validation)" ]; then
            echo 'Mechanism-validation outputs are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/mechanism_validation
          git commit -m 'research: generate mechanism validation pass 2 [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

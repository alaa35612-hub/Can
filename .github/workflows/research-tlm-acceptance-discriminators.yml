name: Research TLM Acceptance Discriminators

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/tools/analyze_tlm_acceptance_discriminators.py'
      - 'research/tools/tests/test_analyze_tlm_acceptance_discriminators.py'
      - '.github/workflows/research-tlm-acceptance-discriminators.yml'
      - 'research/oos_validation/esports_subtype/case_studies/TLMUSDT/**'
      - 'research/oos_validation/esports_subtype/symbol_profiles/TLMUSDT/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused replay tests
        run: python -m unittest research/tools/tests/test_analyze_tlm_acceptance_discriminators.py -v

      - name: Run frozen TLM replay
        run: python research/tools/analyze_tlm_acceptance_discriminators.py

      - name: Commit generated research outputs
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- research/tlm_acceptance_discriminators)" ]; then
            echo 'TLM discriminator outputs are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tlm_acceptance_discriminators
          git commit -m 'research: generate TLM acceptance discriminator replay [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
